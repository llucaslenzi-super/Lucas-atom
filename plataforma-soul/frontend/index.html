<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Soul · Plataforma de Inteligência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#faf9f5; --bg2:#f1efe7; --panel:#ffffff; --panel2:#f4f2ea; --line:#e7e3d7;
  --gold:#c9a227; --gold2:#dcb64a; --cream:#33302a; --text:#2b2823; --muted:#6f6a5b; --muted2:#a6a08e;
  --ok:#3f8f63; --warn:#c07d2e; --danger:#c25242; --radius:14px; --sans:'Inter',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#dcd7c8;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(1200px 600px at 70% -10%, rgba(201,162,39,.10), transparent 60%),
  radial-gradient(900px 500px at 0% 110%, rgba(201,162,39,.06), transparent 55%), var(--bg)}
.login-card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:38px 34px;box-shadow:0 24px 60px rgba(70,60,30,.12)}
.brand-eyebrow{letter-spacing:.28em;font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase}
.brand-title{font-family:var(--serif);font-size:30px;font-weight:500;margin:4px 0 2px;line-height:1.1}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.input{width:100%;background:#f3f1e9;border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--text);font-size:14px;outline:none;transition:border .15s}
.input:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:11px 16px;font-size:14px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1400;border:none;font-weight:600}
.btn.gold:hover{filter:brightness(1.06);color:#1a1400}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.ghost{background:transparent}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.login-hint{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted2)}
.chip{display:inline-block;background:#f3f1e9;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--muted);margin:3px 4px 0 0;cursor:pointer}
.chip:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- SHELL ---------- */
#app{display:none;min-height:100vh;grid-template-columns:250px 1fr;grid-template-rows:60px 1fr;grid-template-areas:"side top" "side main"}
#app.on{display:grid}
.sidebar{grid-area:side;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side-brand{padding:6px 10px 18px}
.side-brand .brand-eyebrow{font-size:9.5px}
.side-brand .t{font-family:var(--serif);font-size:19px;line-height:1.05;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;border:1px solid transparent;transition:.12s}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:rgba(201,162,39,.12);color:var(--gold);border-color:rgba(201,162,39,.28)}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.9}
.nav-sep{margin:12px 12px 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted2)}
.topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(250,249,245,.82);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:#f3f1e9;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.badge{font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 8px;border-radius:20px;border:1px solid var(--gold);color:var(--gold);text-transform:uppercase}
.badge.soft{border-color:var(--line);color:var(--muted)}
.usr{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),#8a6f1a);color:#1a1400;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.main{grid-area:main;overflow-y:auto;height:calc(100vh - 60px)}
.page{padding:30px 34px;max-width:1180px;margin:0 auto}
.page-eyebrow{letter-spacing:.22em;font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase}
.page-title{font-family:var(--serif);font-size:34px;font-weight:500;margin:6px 0 2px;line-height:1.08}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:26px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{margin:0 0 3px;font-size:14px;font-weight:600}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:500;margin-top:6px}
.stat .d{font-size:12px;color:var(--muted2);margin-top:3px}
.stat .ic{width:34px;height:34px;border-radius:9px;background:#f3f1e9;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);float:right}
.stat .ic svg{width:18px;height:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:10px;border-bottom:1px solid #ece9df;vertical-align:top}
tr:hover td{background:rgba(201,162,39,.03)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:rgba(95,174,127,.4)}
.tag.warn{color:var(--warn);border-color:rgba(217,138,58,.4)}
.tag.danger{color:var(--danger);border-color:rgba(207,106,90,.4)}
.tag.gold{color:var(--gold);border-color:rgba(201,162,39,.4)}

/* module cards (dashboard) */
.modgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mod{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:20px;min-height:150px;display:flex;flex-direction:column;transition:.15s;cursor:pointer}
.mod:hover{border-color:var(--gold);transform:translateY(-2px)}
.mod .ic{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);margin-bottom:14px}
.mod .ic svg{width:22px;height:22px}
.mod h4{font-family:var(--serif);font-size:19px;font-weight:500;margin:0 0 4px}
.mod p{font-size:12.5px;color:var(--muted);margin:0;flex:1}
.mod .go{font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;font-weight:600;margin-top:12px}

/* ---------- CHAT (claude-like) ---------- */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 60px)}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line)}
.chat-head .ava{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--gold2),#8a6f1a);color:#1a1400;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;font-family:var(--serif)}
.model-sel{display:flex;align-items:center;gap:6px;background:#f3f1e9;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.model-sel select{background:none;border:none;color:var(--text);outline:none;font-size:13px;font-weight:500}
.chat-scroll{flex:1;overflow-y:auto;padding:24px 0}
.chat-inner{max-width:760px;margin:0 auto;padding:0 20px}
.msg{margin-bottom:26px}
.msg .who{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.msg .who .a{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.msg.user .a{background:#f5ecd2;color:#9a7c1e;border:1px solid var(--line)}
.msg.ai .a{background:linear-gradient(135deg,var(--gold2),#8a6f1a);color:#1a1400}
.msg .who .n{font-size:13px;font-weight:600}
.msg .body{font-size:15px;line-height:1.62;color:var(--text);padding-left:35px}
.msg.user .body{color:var(--cream)}
.msg .body p{margin:0 0 10px}.msg .body h1,.msg .body h2,.msg .body h3{font-family:var(--serif);font-weight:500;margin:14px 0 8px}
.msg .body table{margin:10px 0;font-size:13px}.msg .body th{position:static;background:#f3f1e9}
.msg .body code{background:#f3f1e9;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px}
.msg .body ul,.msg .body ol{margin:0 0 10px;padding-left:20px}
.msg .meta{padding-left:35px;margin-top:9px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted2)}
.msg .meta button{background:none;border:none;color:var(--muted2);display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px}
.msg .meta button:hover{color:var(--gold)}
.msg .src{padding-left:35px;margin-top:8px}
.src-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--gold);background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.25);border-radius:20px;padding:3px 10px}
.alert-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn);background:rgba(217,138,58,.08);border:1px solid rgba(217,138,58,.3);border-radius:20px;padding:3px 10px}
.composer{padding:12px 20px 20px}
.composer.bottom{border-top:1px solid var(--line)}
.composer.home{padding:0}
.composer-inner{max-width:768px;margin:0 auto}
.cbox{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:8px 8px 6px;box-shadow:0 8px 30px rgba(70,60,30,.10);transition:border-color .15s}
.cbox:focus-within{border-color:var(--gold)}
.cbox textarea{width:100%;resize:none;background:none;border:none;padding:12px 14px 6px;color:var(--text);font-size:16px;font-family:inherit;outline:none;max-height:220px;line-height:1.55}
.cbox textarea::placeholder{color:var(--muted2)}
.cbar{display:flex;align-items:center;gap:9px;padding:2px 4px 2px 6px}
.cbar .model-sel{background:#f3f1e9;border:1px solid var(--line);border-radius:20px;padding:5px 10px}
.send-btn{margin-left:auto;width:36px;height:36px;border-radius:11px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1400;border:none;display:flex;align-items:center;justify-content:center;flex:none}
.send-btn:disabled{opacity:.4;cursor:default}
.cost{text-align:center;font-size:11px;color:var(--muted2);margin-top:9px}
.suggested{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.sugg{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 14px;transition:.12s}
.sugg:hover{border-color:var(--gold);color:var(--gold)}
.chat-home{max-width:720px;margin:0 auto;min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;padding:24px 20px 60px}
.chat-home .hi{text-align:center;margin-bottom:26px}
.chat-home .hi .star{width:44px;height:44px;margin:0 auto 16px;color:var(--gold);display:flex;align-items:center;justify-content:center}
.chat-home .hi .star svg{width:44px;height:44px;filter:drop-shadow(0 4px 14px rgba(201,162,39,.4))}
.chat-home .hi h1{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.05;margin:0;color:var(--cream)}
.chat-home .hi p{color:var(--muted);font-size:14px;margin:10px auto 0;max-width:440px}
.typing{display:inline-flex;gap:4px;padding-left:35px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted2);animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--cream);padding:11px 18px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 10px 30px rgba(70,60,30,.18)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #ece9df}
.list-row:hover{background:rgba(201,162,39,.03)}
.mono{font-variant-numeric:tabular-nums}
.section-title{font-family:var(--serif);font-size:20px;font-weight:500;margin:26px 0 12px}
.seg{display:inline-flex;background:#f3f1e9;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg-btn{background:none;border:none;padding:6px 13px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.seg-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bar{height:8px;background:#f3f1e9;border-radius:20px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ece9df;font-size:13px}
.kv b{font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(40,36,28,.4);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;max-height:86vh;overflow-y:auto;padding:24px}
.toggle{width:42px;height:24px;border-radius:20px;background:#f3f1e9;border:1px solid var(--line);position:relative;transition:.15s}
.toggle.on{background:var(--gold)}
.toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.toggle.on i{left:20px;background:#fff}
@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-areas:"top" "main"}
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.2s;width:250px}
  .sidebar.open{transform:none}
  .g4,.g3,.modgrid{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}
  .page{padding:20px 16px}.menu-btn{display:flex!important}
}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;align-items:center;justify-content:center;color:var(--text)}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="login">
  <div class="login-card">
    <div class="brand-eyebrow">Portal Soul</div>
    <div class="brand-title serif">Plataforma de Inteligência</div>
    <div class="login-sub">Soul Têxtil · acesso corporativo seguro</div>
    <form id="loginForm">
      <div class="field"><label>E-mail corporativo</label><input class="input" type="email" id="email" placeholder="voce@soultextil.com.br" autocomplete="username" required></div>
      <div class="field"><label>Senha</label><input class="input" type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required></div>
      <button class="btn gold block" type="submit" id="loginBtn">Entrar</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="login-hint">
      Acesso restrito · MFA e SSO Microsoft Entra habilitados por perfil.
    </div>
  </div>
</div>

<!-- ==================== APP SHELL ==================== -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand"><div class="brand-eyebrow">Portal Soul</div><div class="t serif">Inteligência</div></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <header class="topbar">
    <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="globalSearch" placeholder="Buscar em conversas, produtos, fontes…"></div>
    <div class="topbar-right">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" style="cursor:pointer"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <div class="usr"><div class="avatar" id="avatar">?</div>
        <div style="line-height:1.15"><div style="font-size:13px;font-weight:600" id="uName">—</div><div style="font-size:11px;color:var(--muted)" id="uArea">—</div></div>
        <span class="badge" id="uBadge" style="display:none">Admin</span>
      </div>
      <button class="btn sm ghost" id="logoutBtn">Sair</button>
    </div>
  </header>
  <main class="main" id="main"></main>
</div>

<script>
const API='/webhook/plat/api';
const MODELOS=[{id:'claude-sonnet-5',label:'Claude Sonnet 5',hint:'equilíbrio'},{id:'claude-opus-5-5',label:'Claude Opus 5.5',hint:'máxima capacidade'},{id:'claude-haiku-4-5-20251001',label:'Claude Haiku 4.5',hint:'rápido e barato'}];
const ICON={
 dash:'<path d="M3 13h8V3H3zM13 21h8V3h-8zM3 21h8v-6H3z"/>',
 chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 hist:'<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>',

  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('email').value.trim().toLowerCase(),senha:document.getElementById('senha').value})});

async function boot(){

  if(!me||!me.sucesso){doLogout();return;}
  state.user=me;state.modelo='claude-sonnet-5';
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  const ini=(me.nome||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('avatar').textContent=ini;
  document.getElementById('uName').textContent=me.nome||me.usuario;

  document.getElementById('uBadge').style.display=me.is_admin?'inline-block':'none';

function renderChat(m){
  const sug=SUGGEST[state.user.area]||SUGGEST.default;
  const empty=!state.messages.length;
  const comp='<div class="composer-inner"><div class="cbox">'
    +'<textarea id="composer" rows="1" placeholder="Pergunte algo sobre '+esc((state.user.area||'').toLowerCase())+'…"></textarea>'

    +'<button class="send-btn" id="sendBtn" title="Enviar">'+svg('<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>')+'</button></div></div>'
    +'<div class="cost" id="costLine"></div></div>';
  if(empty){
    m.innerHTML='<div class="chatwrap"><div class="chat-scroll" id="chatScroll">'
      +'<div class="chat-home"><div class="hi"><div class="star">'+svg(ICON.spark)+'</div>'
      +'<h1>Bem-vindo de volta, '+esc(state.user.nome.split(' ')[0])+'</h1>'
      +'<p>Converse com a IA da Soul usando os dados reais liberados para o seu perfil — '+esc(state.user.area)+'.</p></div>'
      +'<div class="composer home">'+comp+'</div>'
      +'<div class="suggested">'+sug.map(s=>'<button class="sugg" onclick="quick(this)">'+esc(s)+'</button>').join('')+'</div>'
      +'</div></div></div>';
  }else{
    m.innerHTML='<div class="chatwrap">'
      +'<div class="chat-head"><div class="ava">S</div><span style="font-weight:600;font-size:14px">Soul IA</span>'
      +'<button class="btn sm" style="margin-left:auto" onclick="newChat()">+ Nova conversa</button></div>'
      +'<div class="chat-scroll" id="chatScroll"><div class="chat-inner" id="chatInner"></div></div>'
      +'<div class="composer bottom">'+comp+'</div></div>';
  }
  const sel=document.getElementById('modelSel');sel.value=state.modelo;
  const hint=()=>{const mo=MODELOS.find(x=>x.id===sel.value);const mh=document.getElementById('modelHint');if(mh)mh.textContent='· '+mo.hint;const cl=document.getElementById('costLine');if(cl)cl.textContent='Modelo: '+mo.label+' · o custo de cada resposta é registrado';};
  sel.onchange=()=>{state.modelo=sel.value;hint();};hint();
  const ta=document.getElementById('composer');
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,220)+'px'};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}};
  document.getElementById('sendBtn').onclick=sendMsg;
  if(!empty)paintMessages();
  ta.focus();
}
const SUGGEST={
 Industrial:['Qual o estoque disponível do produto 1502002?','Fios com maior saldo em kg','Estoque livre da malha dry'],
 Financeiro:['Faturamento dos últimos 30 dias por filial','Títulos vencidos em aberto','Contas a receber a vencer nos próximos 15 dias'],

function quick(b){document.getElementById('composer').value=b.textContent;sendMsg();}
function newChat(){state.convId=null;state.messages=[];renderChat(document.getElementById('main'));}
function paintMessages(){
  const el=document.getElementById('chatInner');if(!el)return;
  if(!state.messages.length)return;
  el.innerHTML=state.messages.map((m,i)=>renderMsg(m,i)).join('')+(state.sending?'<div class="msg ai"><div class="who"><div class="a">S</div><div class="n">Soul IA</div></div><div class="typing"><span></span><span></span><span></span></div></div>':'');
  const sc=document.getElementById('chatScroll');sc.scrollTop=sc.scrollHeight;
}
function renderMsg(m,i){
  if(m.role==='user')return '<div class="msg user"><div class="who"><div class="a">'+esc((state.user.nome||'U')[0])+'</div><div class="n">Você</div></div><div class="body">'+esc(m.text).replace(/\n/g,'<br>')+'</div></div>';
  let src='';
  if(m.fonte&&m.fonte!=='Fora de escopo'&&m.fonte!=='')src='<div class="src"><span class="src-pill">'+svg(ICON.db)+esc(m.fonte)+(m.dados_n!=null?' · '+m.dados_n+' registros':'')+'</span></div>';
  if(m.alerta==='fora_escopo')src='<div class="src"><span class="alert-pill">⚠ Fora do perfil de acesso</span></div>';
  else if(m.alerta==='pii')src='<div class="src"><span class="alert-pill">⚠ Dados pessoais mascarados (guardrail)</span></div>';
  const meta='<div class="meta"><span>'+esc(modelLabel(m.modelo))+'</span>'+(m.custo!=null?'<span>· '+brl(m.custo)+'</span>':'')
    +'<button onclick="copyMsg('+i+')">'+svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>')+'Copiar</button>'
    +'<button onclick="regen('+i+')">'+svg(ICON.hist)+'Regenerar</button>'
    +'<button onclick="rate('+i+',\'up\')" class="'+(m.fb==='up'?'gold':'')+'">👍</button>'
    +'<button onclick="rate('+i+',\'down\')" class="'+(m.fb==='down'?'gold':'')+'">👎</button>'
    +'<button onclick="destacar('+i+')">'+svg(ICON.star)+'Destacar</button></div>';
  return '<div class="msg ai"><div class="who"><div class="a">S</div><div class="n">Soul IA</div></div><div class="body">'+(window.marked?marked.parse(m.text||''):esc(m.text))+'</div>'+src+meta+'</div>';
}
function modelLabel(id){const x=MODELOS.find(y=>y.id===id);return x?x.label:(id||'')}
async function sendMsg(){
  const ta=document.getElementById('composer');const txt=(ta.value||'').trim();if(!txt||state.sending)return;
  state.messages.push({role:'user',text:txt});ta.value='';ta.style.height='auto';state.sending=true;
  if(document.getElementById('chatInner')){paintMessages();}else{renderChat(document.getElementById('main'));}
  try{
    const j=await api('/chat',{method:'POST',body:JSON.stringify({mensagem:txt,modelo:state.modelo,conversa_id:state.convId})});
    state.convId=j.conversa_id||state.convId;
    state.messages.push({role:'ai',text:j.resposta||'(sem resposta)',fonte:j.fonte,modelo:j.modelo,custo:j.custo,alerta:j.alerta,dados_n:j.dados_n,iid:j.interacao_id});
  }catch(e){state.messages.push({role:'ai',text:'Não consegui responder agora. Tente novamente.',alerta:''});}
  state.sending=false;paintMessages();
}
function copyMsg(i){navigator.clipboard.writeText(state.messages[i].text||'');toast('Copiado')}
function regen(i){const u=state.messages.slice(0,i).reverse().find(x=>x.role==='user');if(!u)return;state.messages=state.messages.slice(0,i);document.getElementById('composer').value=u.text;sendMsg()}
async function rate(i,v){const m=state.messages[i];m.fb=v;paintMessages();try{await api('/feedback',{method:'POST',body:JSON.stringify({interacao_id:m.iid,feedback:v})})}catch(e){}}
async function destacar(i){const m=state.messages[i];try{await api('/destacar',{method:'POST',body:JSON.stringify({interacao_id:m.iid})});toast('Adicionado à biblioteca da equipe')}catch(e){toast('Não foi possível destacar')}}
async function openConv(id){state.convId=id;state.messages=[];go('chat');try{const j=await api('/conversa?id='+encodeURIComponent(id));(j.mensagens||[]).forEach(x=>{state.messages.push({role:'user',text:x.prompt});state.messages.push({role:'ai',text:x.resposta,fonte:x.fonte,modelo:x.modelo,custo:x.custo})});renderChat(document.getElementById('main'))}catch(e){}}

function buildConvs(rows){
  var cm={};
  rows.forEach(function(r){var c=r.conversa_id||('u-'+(r.uid||''));var t=r.criado_em||r.createdAt;
    if(!cm[c]){cm[c]={conversa_id:c,titulo:String(r.prompt||'Conversa').slice(0,80),n:0,ts:t,ts0:t,fonte:r.fonte||'',usuario:r.usuario||'',nome:r.usuario||'',area:r.area||'',custo:0};}
    cm[c].n++;cm[c].custo+=Number(r.custo||0);
    if(new Date(t)>new Date(cm[c].ts))cm[c].ts=t;
    if(new Date(t)<=new Date(cm[c].ts0)){cm[c].ts0=t;cm[c].titulo=String(r.prompt||cm[c].titulo).slice(0,80);}
  });
  return Object.keys(cm).map(function(k){return cm[k];}).sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
}
async function loadHistGlobal(){
  var body=document.getElementById('histBody');if(body)body.innerHTML='<div class="muted" style="padding:10px">Carregando…</div>';
  var d={},u={};
  try{d=await api('/admin/rastreabilidade')}catch(e){}
  try{u=await api('/admin/usuarios')}catch(e){}
  var nm={};(u.usuarios||[]).forEach(function(x){nm[String(x.usuario).toLowerCase()]=x.nome;});
  _histRows=d.interacoes||[];
  _histConvs=buildConvs(_histRows);
  _histConvs.forEach(function(c){c.nome=nm[String(c.usuario).toLowerCase()]||c.usuario;});
  renderHist();
}
async function loadHistMine(){
  var body=document.getElementById('histBody');if(body)body.innerHTML='<div class="muted" style="padding:10px">Carregando…</div>';
  var d={};try{d=await api('/historico')}catch(e){}
  var flat=[];(d.grupos||[]).forEach(function(g){(g.itens||[]).forEach(function(c){flat.push({conversa_id:c.conversa_id,titulo:c.titulo,n:c.n,ts:c.ts,fonte:c.fonte,nome:state.user.nome,usuario:state.user.usuario,area:state.user.area,custo:0});});});
  _histRows=[];_histConvs=flat.sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
  renderHist();
}
function renderHist(){
  var admin=state.histMode==='all';
  var q=(val('histSearch')||'').toLowerCase(),fa=val('histArea')||'';
  var list=_histConvs.filter(function(c){
    if(fa&&c.area!==fa)return false;
    if(q){var hay=((c.titulo||'')+' '+(c.nome||'')+' '+(c.usuario||'')+' '+(c.area||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  var body=document.getElementById('histBody');if(!body)return;
  if(!list.length){body.innerHTML='<div class="muted" style="padding:10px">Nenhuma conversa encontrada.</div>';return;}
  var groups={},order=[];
  list.forEach(function(c){var L=dateLabel(c.ts);if(!groups[L]){groups[L]=[];order.push(L);}groups[L].push(c);});
  var h='';
  order.forEach(function(L){
    h+='<div class="section-title serif">'+esc(L)+'</div><div class="card">'+groups[L].map(function(c){
      var meta=fmtDT(c.ts)+' · '+num(c.n)+' msg'+(admin?(c.area?' · '+esc(c.area):''):(c.fonte?' · '+esc(c.fonte):''))+(admin&&c.custo?' · '+brl(c.custo):'');
      var who=admin?'<div style="width:150px;min-width:120px"><div style="font-weight:600;font-size:13px">'+esc(c.nome||c.usuario)+'</div><div style="font-size:11px;color:var(--muted2)">'+esc(c.usuario)+'</div></div>':'';
      var btn=admin?'<button class="btn sm" onclick="openConvGlobal(\''+c.conversa_id+'\')">Ver</button>':'<button class="btn sm" onclick="openConv(\''+c.conversa_id+'\')">Continuar</button>';
      return '<div class="list-row">'+who+'<div style="flex:1"><div style="font-weight:500">'+esc(c.titulo)+'</div><div style="font-size:12px;color:var(--muted2)">'+meta+'</div></div>'+btn+'</div>';
    }).join('')+'</div>';
  });
  body.innerHTML=h;
}
function dateLabel(t){var d=new Date(t);if(isNaN(d))return 'Mais antigo';var diff=(Date.now()-d.getTime())/864e5;if(diff<1)return 'Hoje';if(diff<2)return 'Ontem';if(diff<7)return 'Esta semana';if(diff<31)return 'Este mês';if(diff<93)return 'Últimos 3 meses';return 'Mais antigo';}
function openConvGlobal(id){
  var rows=_histRows.filter(function(r){return (r.conversa_id||'')===id;}).sort(function(a,b){return new Date(a.criado_em||a.createdAt)-new Date(b.criado_em||b.createdAt);});
  if(!rows.length)return;
  var u=rows[0],body='';
  rows.forEach(function(r){
    body+='<div class="section-title serif" style="font-size:14px">Pergunta</div><div class="card" style="white-space:pre-wrap;font-size:13px">'+esc(r.prompt)+'</div>';
    body+='<div class="section-title serif" style="font-size:14px">Resposta · '+esc(modelLabel(r.modelo))+' · '+brl(r.custo)+(r.alerta?' · '+alertTag(r.alerta):'')+'</div><div class="card" style="font-size:13px">'+(window.marked?marked.parse(r.resposta||''):esc(r.resposta))+'</div>';
  });
  openModal('<div class="page-eyebrow">Conversa · auditoria</div><div class="page-title serif" style="font-size:20px">'+esc(u.usuario||'')+'</div><div class="muted" style="font-size:12px;margin-bottom:6px">'+esc(u.area||'')+' · '+num(rows.length)+' interação(ões)</div>'+body);
}
