[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atom-backend"
version = "0.1.0"
description = "Atom - Agente de Prospeccao de Exportacao (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "alembic>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
