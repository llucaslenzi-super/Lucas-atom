services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atom_owner
      POSTGRES_PASSWORD: atom
      POSTGRES_DB: atom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atom_owner -d atom"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://atom_app@db:5432/atom
      ADMIN_DATABASE_URL: postgresql+psycopg://atom_owner:atom@db:5432/atom
      JWT_SECRET: change-me-in-secret-manager
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
